# Tag-driven release: gate → npm publish → GitHub Release.
#
# Pushing `vX.Y.Z` is the whole trigger. The tag must name the version in
# `package.json`, its commit must be on `main` (a `v*` on a feature branch
# would publish unreviewed code), and the CHANGELOG section for that version
# must exist — that section IS the release body, so the notes are reviewable in
# the repository instead of being typed into a web form after the fact.
#
# WHY THE ORDER IS gate → publish → release, and not the reverse: a GitHub
# Release announces an installable version. Creating it first means the release
# page can point at a tarball npm has not accepted yet (or rejected outright),
# which is the one failure a reader cannot see.
#
# THREE STEPS FAIL SILENTLY WHEN SKIPPED (the same list AGENTS.md keeps, and
# the reason each check below exists):
#
#   1. The tag and `package.json` disagree. `npm publish` then publishes the
#      version in `package.json` while the tag and the release announce another.
#   2. The README install pins are not bumped before publishing. npm serves the
#      README captured in the tarball, so a pin bumped afterwards is stale on
#      the npm page for that version, permanently.
#   3. The GitHub Release is missing, or the tarball is attached only under a
#      version-specific name. `releases/latest/download/dsh-cherry-bridge.tgz`
#      is what the plugin catalog resolves to; a versioned name 404s there.
#
# `workflow_dispatch` is a DRY RUN: it runs the same token preflight, notes,
# pins and gate, then `npm publish --dry-run`; it never publishes or creates a
# release. A real publish always requires a tag, so the release commit stays the
# only place the version is decided.
#
# Re-running is safe. npm rejects a republished version with a 409, so the
# publish step first asks the registry whether the version is already there and
# skips if it is — only a 404 means "not published"; any other answer stops the
# run. The release steps are idempotent (`view`/`edit` or `create`, `upload
# --clobber`), except a DRAFT, which is refused: publishing someone else's
# in-progress release would announce text this chain never reviewed. That
# idempotency matters because the failure most likely to need a retry —
# registry propagation — happens AFTER the irreversible step, and the
# `--prefer-online` reads below are what make the retry see the new version.
#
# "Published" is proved by CONTENT, not by the registry's own hash: the tarball
# is unpacked beside a pack of this tag's tree and `diff -r`'d. Comparing the
# download with `dist.shasum` only proves the download completed, and tarball
# bytes are not reproducible across environments anyway.
#
# `--latest` is explicit rather than left to gh's date-and-version heuristic:
# `releases/latest/download/dsh-cherry-bridge.tgz` resolves against whichever
# release is marked latest, so a release created out of order (a backfill, a
# re-run for an older tag) would silently move that URL onto a release with no
# asset on it. A backfill is refused BEFORE publishing: the pre-publish
# `dist-tags.latest` check rejects a version older than the registry's latest,
# because publishing it would move `latest` backwards and the post-publish
# check would then agree with itself.
#
# The gate runs twice on purpose: once explicitly, and once inside `npm publish`
# through `prepublishOnly`. The explicit run names the failing gate before the
# publish step; the implicit run is npm's own and is deliberately NOT bypassed
# with `--ignore-scripts`.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# `contents: write` uploads the release asset. Everything else is read-only.
permissions:
  contents: write

# GLOBAL, not per-ref: two releases can race the backfill read (read-then-act)
# and the `--latest` move, and a re-run must never overlap its own tag's run.
# The cost is GitHub's queue rule: a third run joining the group replaces the
# PENDING one, so a burst of tags can leave the middle tag unrun — visible as
# no publish and no release for it, and fixed by re-running that tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The checkout token is not persisted: `contents: write` would otherwise
      # sit in `.git/config` while `npm ci` scripts and the full suite run.
      # Every step that needs the API passes GH_TOKEN instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # A dry run must answer "is the token still usable?" before the notes and
      # the gate, not after two minutes of tests. This proves authentication,
      # not the 2FA-bypass flag; only a real publish proves that, and the
      # failure is safe (nothing is uploaded).
      - name: the token can authenticate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      - name: the tag names the version in package.json
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            [ "v$VERSION" = "$TAG" ] || {
              echo "::error::tag $TAG does not match package.json version $VERSION"
              exit 1
            }
            echo "releasing $VERSION from $TAG"
          else
            echo "dry run: manifest version $VERSION (a dispatch has no tag to compare)"
          fi

      # A `v*` on a feature-branch tip would publish unreviewed code and mark it
      # latest. `compare/main...<tag commit>` answers `behind` once main has
      # taken the release merge (the normal case — measured on v0.4.2) and
      # `identical` when the tag is main's tip; `ahead`/`diverged` mean the
      # commit is not in main.
      - name: the tag commit is on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
          case "$STATUS" in
            behind|identical) echo "the tag commit is on main ($STATUS)" ;;
            *)
              echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main ($STATUS)"
              exit 1
              ;;
          esac

      - name: the release notes for this version exist
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          awk -v h="## v$VERSION " '
            index($0, h) == 1 { inside = 1; print; next }
            inside && /^## v[0-9]/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || {
            echo "::error file=CHANGELOG.md::missing the ## v$VERSION section — the release body is that section"
            exit 1
          }
          ZH=$(grep -n '^\*\*中文\*\*$' release-notes.md | cut -d: -f1 || true)
          EN=$(grep -n '^\*\*English\*\*$' release-notes.md | cut -d: -f1 || true)
          [ -n "$ZH" ] && [ -n "$EN" ] && [ "$ZH" -lt "$EN" ] || {
            echo "::error file=CHANGELOG.md::the ## v$VERSION section must carry **中文** then **English**"
            exit 1
          }
          echo "release-notes.md: $ZH → $EN"

      - name: the README install pins name the version being published
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for f in README.md README.en.md; do
            grep -q "dsh-cherry-bridge@$VERSION" "$f" \
              || { echo "::error file=$f::missing the @$VERSION install pin"; exit 1; }
            grep -q "#v$VERSION" "$f" \
              || { echo "::error file=$f::missing the #v$VERSION install pin"; exit 1; }
          done

      # Publishing an older version moves `latest` backwards before the
      # post-publish guard can see it, so the check has to run first. Equal
      # (a re-run of the current latest) and greater (a new version) pass; an
      # older version is refused here. Tags are plain X.Y.Z: `sort -V` is not
      # semver, so a prerelease is refused outright rather than guessed at.
      - name: a backfill must not move latest backwards
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) echo "::error::prerelease $VERSION is not supported by this release path"; exit 1 ;;
          esac
          LATEST=$(npm view dsh-cherry-bridge dist-tags.latest)
          HIGHER=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)
          [ "$HIGHER" = "$VERSION" ] || {
            echo "::error::dsh-cherry-bridge@$VERSION is older than dist-tags.latest $LATEST — a backfill must not move latest"
            exit 1
          }
          echo "latest $LATEST → $VERSION"

      - run: npm ci

      # `prepublishOnly` IS the gate: typecheck, the full suite, both builds and
      # `npm pack --dry-run`. It runs again inside `npm publish` below — that
      # costs a few minutes on a job that runs a handful of times a year, and it
      # means no step here depends on `publish` forwarding flags.
      - run: npm run prepublishOnly

      # The WHOLE tree, not just `dist lib`: a tracked file under `files` that a
      # script rewrote would land in the tag-tree pack AND in the publish, so
      # the content diff could not see it. This also catches a rebuild that
      # changes committed artifact bytes, and a file-MODE drift (0.4.1's 0600).
      - name: the checkout still matches the tag tree
        run: git diff --exit-code

      # A draft left over from an earlier attempt would make the release step
      # fail AFTER the irreversible publish, leaving a version nobody can
      # install through the catalog URL. Refuse before publishing.
      - name: no draft release for this tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = "true" ]; then
            echo "::error::v$VERSION already has a DRAFT release; publish or delete it by hand, then run this tag again"
            exit 1
          fi
          echo "no draft release for v$VERSION ($DRAFT)"

      # The pack of THIS tree is the only non-circular reference: comparing a
      # registry tarball with the registry's own `dist.shasum` proves the
      # download completed, never that the tag's tree was what got published.
      # Packed OUTSIDE the repo on purpose — a tarball in the tree would be
      # repacked into the very tarball that publishes.
      - name: pack the tag tree (tag push only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p "$RUNNER_TEMP/tag-tree"
          npm pack --pack-destination "$RUNNER_TEMP/tag-tree"
          echo "tag tree: $RUNNER_TEMP/tag-tree/dsh-cherry-bridge-$VERSION.tgz"

      # Two steps, not one shell branch: a dispatch must not be one deleted
      # `exit 0` away from publishing for real. The tag step is the only one
      # that can publish; the dispatch step is the only one that can dry-run.
      - name: publish (tag push only)
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # Only a 404 means "not published". Treating any failure that way
          # would send a network/5xx/auth error into `npm publish`, which npm
          # answers with a 409 on an already-published version — breaking the
          # re-run this branch exists for.
          set +e
          OUT=$(npm view "dsh-cherry-bridge@$VERSION" version --prefer-online 2>&1)
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "dsh-cherry-bridge@$VERSION is already published; skipping (re-run path)"
          elif printf '%s' "$OUT" | grep -qE 'E404|404 Not Found'; then
            npm publish --tag latest
          else
            echo "::error::npm view failed for a reason other than E404; refusing to publish"
            printf '%s\n' "$OUT" >&2
            exit 1
          fi

      - name: dry run (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "dry run: not publishing"
          npm publish --dry-run --tag latest

      # Proof that the published artifact IS this tag's tree. Tarball BYTES are
      # not reproducible across environments (0.4.1's mode ghost; the wrapper
      # measured an 11-byte difference with identical unpacked contents), so the
      # gate unpacks both tarballs and diffs CONTENTS. `--prefer-online` defeats
      # the negative packument the pre-publish `npm view` left behind (registry
      # cache-control: max-age=300) — the wrapper's first real tag spent its
      # whole retry window on exactly that cache.
      - name: the published contents match the tag tree
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 20); do
            rm -rf registry reg-x local-x
            mkdir -p registry reg-x local-x
            if npm pack "dsh-cherry-bridge@$VERSION" --prefer-online --pack-destination registry >/dev/null 2>&1; then
              tar -xzf "registry/dsh-cherry-bridge-$VERSION.tgz" -C reg-x
              tar -xzf "$RUNNER_TEMP/tag-tree/dsh-cherry-bridge-$VERSION.tgz" -C local-x
              if ! diff -r local-x/package reg-x/package; then
                echo "::error::the published contents differ from the tag tree"
                exit 1
              fi
              echo "contents match ($(find reg-x/package -type f | wc -l) files)"
              # The asset is the published tarball itself, copied only after its
              # contents proved equal — a rebuild would be a hope, not evidence.
              cp "registry/dsh-cherry-bridge-$VERSION.tgz" dsh-cherry-bridge.tgz
              exit 0
            fi
            echo "attempt $attempt: tarball not downloadable yet"
            sleep 30
          done
          echo "::error::dsh-cherry-bridge@$VERSION never became downloadable"
          exit 1

      # The release may only announce a version the registry calls latest.
      # The pre-publish check above refuses a backfill; this one confirms the
      # publish moved `latest` (and tolerates registry lag).
      - name: the registry's latest tag names this version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 6); do
            LATEST=$(npm view dsh-cherry-bridge dist-tags.latest --prefer-online)
            if [ "$LATEST" = "$VERSION" ]; then
              echo "dist-tags.latest is $VERSION (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt: dist-tags.latest is $LATEST"
            sleep 10
          done
          echo "::error::dist-tags.latest is $LATEST, not $VERSION — refusing to announce it"
          exit 1

      - name: create the GitHub Release (idempotent)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # The checkout above already proved the tag exists; `--verify-tag`
          # depends on a local tag ref that actions/checkout may not leave.
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            # A draft is someone else's release in progress. Publishing it here
            # would announce text this chain never reviewed, so it is refused
            # rather than adopted: the tag chain owns the release lifecycle.
            DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft)
            if [ "$DRAFT" = "true" ]; then
              echo "::error::v$VERSION exists as a DRAFT; publish or delete it by hand, then re-run"
              exit 1
            fi
            # A re-run of a published release refreshes its notes and keeps it
            # latest; `view || create` alone would leave stale text in place.
            gh release edit "v$VERSION" --notes-file release-notes.md --latest
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: attach the version-independent tarball name
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # The plugin catalog points at
          # releases/latest/download/dsh-cherry-bridge.tgz — NOT at a name with
          # the version in it.
          gh release upload "v$VERSION" dsh-cherry-bridge.tgz --clobber

      # A freshly uploaded asset is not instantly downloadable (0.3.0 answered
      # 504 for about three minutes after the upload), so this is retried — a
      # single curl turns a propagation delay into a red run for a complete
      # release.
      - name: the catalog's URL answers 200
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dsh-cherry-bridge.tgz"
          for attempt in $(seq 1 6); do
            CODE=$(curl -sL -o /dev/null -w '%{http_code}' "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "$URL → 200 (attempt $attempt)"
              exit 0
            fi
            echo "attempt $attempt → $CODE"
            sleep 20
          done
          echo "::error::$URL never answered 200"
          exit 1
